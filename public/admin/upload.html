<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff7fa"><title>Manage products — Shugharh's Girly Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/animations.css"><script type="module" src="../js/admin.js"></script></head>
<body class="admin-body"><div data-admin-shell></div><main class="admin-main"><div class="admin-page-heading"><div><p class="eyebrow">YOUR LITTLE COLLECTION</p><h1>Add a little <em>pretty.</em></h1><p>Add, update, or remove pieces from your shop.</p></div></div><section class="upload-layout"><form class="product-form panel" data-product-form><input type="hidden" name="id"><div class="form-heading"><p class="eyebrow">PRODUCT DETAILS</p><h2 data-form-title>Add a product</h2></div><label>Product name<input name="name" required maxlength="100" placeholder="e.g. The Sunday Girl Top"></label><label>Description<textarea name="description" rows="4" required maxlength="1000" placeholder="Tell us what makes this piece special…"></textarea></label><div class="form-row"><label>Price (GHS)<input name="price" type="number" min="0.01" step="0.01" required placeholder="120.00"></label><label>Stock<input name="stock" type="number" min="0" step="1" required placeholder="10"></label></div><label>Category<select name="category" required><option value="">Choose one</option><option>Crop Top</option><option>Short Top</option><option>Dress</option><option>Accessories</option></select></label><fieldset><legend>Available sizes</legend><div class="size-checks"><label><input type="checkbox" name="sizes" value="S"> S</label><label><input type="checkbox" name="sizes" value="M"> M</label><label><input type="checkbox" name="sizes" value="L"> L</label><label><input type="checkbox" name="sizes" value="One Size"> One Size</label></div></fieldset><label class="upload-drop"><input type="file" name="image" accept="image/*" data-image-input><span class="upload-preview" data-image-preview><i>＋</i><strong>Choose a product photo</strong><small>JPG, PNG, or WebP · up to 5 MB</small></span></label><p class="form-message" data-product-message role="status"></p><div class="form-actions"><button class="button button-dark" type="submit">Save product <span>♡</span></button><button class="button button-light" type="button" data-reset-product>Clear</button></div></form><aside class="product-manager panel"><div class="admin-panel-heading"><div><p class="eyebrow">IN YOUR SHOP</p><h2>All products</h2></div></div><div class="admin-product-list" data-admin-products></div></aside></section></main></body></html>
